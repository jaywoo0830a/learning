<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>자유 글쓰기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Edu+VIC+WA+NT+Hand:wght@400..700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/htmlasitis@0.1.0/htmlasitis.css">
  <style>
    :root {
      --hai-font-body: "Nanum Pen Script", cursive;
      --hai-font-mono: "Nanum Pen Script", monospace;
      --hai-font-size-body: 11pt;
      --hai-line-height-body: 1.7;
    }

    .hai-page {
      background: #ffffff;
      padding: 8pt 10pt 0 10pt;
    }

    .hai-page h1 {
      font-family: "Nanum Pen Script", cursive;
      font-size: 13pt;
      font-weight: 400;
      margin: 0 0 2pt 0;
      padding-bottom: 2pt;
      border-bottom: 0.5pt solid #ddd;
      color: #555;
      text-align: center;
      letter-spacing: 0.5pt;
    }

    .hairline { border: none; border-top: 0.25pt solid #e8e8e8; margin: 4pt 0; }

    .row { display: flex; gap: 6pt; }
    .c1 { flex: 1; } .c2 { flex: 2; } .c3 { flex: 3; }

    /* ── 초소형 헤더 ────────────────────────────────────────────── */
    .tiny-header {
      display: flex;
      align-items: center;
      gap: 4pt;
      font-family: "Nanum Pen Script", cursive;
      font-size: 9pt;
      color: #777;
      margin-bottom: 3pt;
      flex-wrap: wrap;
    }
    .tiny-header .label { color: #bbb; font-size: 8pt; margin-right: 1pt; }
    .tiny-header .value {
      border-bottom: 0.4pt solid #ddd;
      min-width: 55pt;
      padding: 0 3pt;
      font-size: 9pt;
    }

    /* ── 초소형 글감 힌트 (한 줄) ───────────────────────────────── */
    .hint-line {
      font-family: "Nanum Pen Script", cursive;
      font-size: 7pt;
      color: #ccc;
      margin-bottom: 4pt;
      line-height: 1.3;
      text-align: center;
    }

    .writing-block {
      padding: 0 2pt;
      font-family: "Nanum Pen Script", cursive;
      font-size: 11pt;
      line-height: 1.55;
      color: #444;
    }

    .ext-badge {
      display: inline-block;
      font-family: "Nanum Pen Script", cursive;
      font-size: 7pt;
      color: #ccc;
      border: 0.3pt solid #eee;
      padding: 1pt 6pt;
      border-radius: 2pt;
      margin-bottom: 3pt;
    }

    .footer-note {
      text-align: right;
      font-family: "Nanum Pen Script", cursive;
      font-size: 7pt;
      color: #ddd;
      margin-top: 4pt;
    }

    .pl {
      border-bottom: 0.3pt solid #e8e8e8;
      min-height: 17.5pt;
      margin: 0.5pt 0;
    }

    @media print {
      .hai-page + .hai-page {
        page-break-before: always;
      }
    }
  </style>
</head>
<body>

<!-- ================================================================ -->
<!-- 1쪽: 자유 글쓰기 — 최대한 많은 줄                                  -->
<!-- ================================================================ -->
<section class="hai-page">
  <h1>✽ 자유 글쓰기 ✽</h1>

  <div class="writing-block" style="min-height:455pt;">
    <div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div>
    <div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div>
    <div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div>
    <div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div>
    <div class="pl"></div><div class="pl"></div><div class="pl"></div>
  </div>

  <div class="tiny-header" style="margin-top:4pt;">
    <span class="label">날짜</span><span class="value" style="min-width:85pt;">&nbsp;</span>
    <span class="label">글감</span><span class="value" style="min-width:140pt;">&nbsp;</span>
  </div>

  <p class="footer-note">멈추지 않고 썼다면 성공입니다</p>
</section>

<!-- ================================================================ -->
<!-- 2쪽부터: 연장 페이지                                               -->
<!-- ================================================================ -->
<section class="hai-page">
  <span class="ext-badge">이어서</span>
  <h1>✽ 자유 글쓰기 ✽</h1>

  <div class="writing-block" style="min-height:475pt;">
    <div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div>
    <div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div>
    <div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div>
    <div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div>
    <div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div>
  </div>

  <div class="tiny-header" style="margin-top:4pt;">
    <span class="label">날짜</span><span class="value" style="min-width:85pt;">&nbsp;</span>
    <span class="label">글감</span><span class="value" style="min-width:140pt;">&nbsp;</span>
  </div>

  <p class="footer-note">필요한 만큼 더 인쇄하세요</p>
</section>

</body>
</html>
