<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>원고지</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/htmlasitis@0.1.0/htmlasitis.css">
  <style>
    :root {
      --hai-font-body: "Nanum Pen Script", cursive;
      --hai-font-mono: "Nanum Pen Script", monospace;
      --hai-font-size-body: 9pt;
      --hai-line-height-body: 1.3;
    }

    .hai-page {
      background: #ffffff;
      padding: 4pt 6pt 2pt 6pt;
    }

    /* ── 원고지 그리드 — 20열 정사각형 칸 ──────────────────────── */
    .manuscript-grid {
      display: grid;
      grid-template-columns: repeat(20, 1fr);
      grid-template-rows: repeat(28, 1fr);
      border: 1pt solid #999;
      width: 100%;
      aspect-ratio: 20 / 28;
    }
    .manuscript-grid .cell {
      aspect-ratio: 1;
      position: relative;
    }
    /* 정사각형 칸 중앙에 십자 가이드 (원고지 특유의 표시) */
    .manuscript-grid .cell::before {
      content: "+";
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 5pt;
      color: #ddd;
      line-height: 1;
      pointer-events: none;
    }

    @media print {
      .hai-page { padding: 3pt 6pt 1pt 6pt; }
    }
  </style>
</head>
<body>

<section class="hai-page">

  <div class="manuscript-grid" id="grid"></div>

</section>

<script>
  const COLS = 20;
  const ROWS = 28;
  const TOTAL = COLS * ROWS;

  // ── 굵기 설정 (원하는 대로 바꾸세요) ──────────────────────────
  const INNER = '0.4pt solid #ccc'; // 내부선

  const grid = document.getElementById('grid');

  for (let i = 0; i < TOTAL; i++) {
    const row = Math.floor(i / COLS);
    const col = i % COLS;

    const cell = document.createElement('div');

    // BT: 첫 행이면 grid 외곽선이 덮으므로 생략
    cell.style.borderTop    = (row === 0)        ? 'none' : INNER;
    // BB: 마지막 행이면 grid 외곽선이 덮으므로 생략
    cell.style.borderBottom = (row === ROWS - 1) ? 'none' : INNER;
    // BL: 첫 열이면 grid 외곽선이 덮으므로 생략
    cell.style.borderLeft   = (col === 0)        ? 'none' : INNER;
    // BR: 마지막 열이면 grid 외곽선이 덮으므로 생략
    cell.style.borderRight  = (col === COLS - 1) ? 'none' : INNER;

    grid.appendChild(cell);
  }
</script>

</body>
</html>
