<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>원고지</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/htmlasitis@0.1.0/htmlasitis.css">
  <style>
    :root {
      --hai-font-body: "Nanum Pen Script", cursive;
      --hai-font-mono: "Nanum Pen Script", monospace;
      --hai-font-size-body: 9pt;
      --hai-line-height-body: 1.3;
    }

    .hai-page {
      background: #ffffff;
      padding: 4pt 6pt 2pt 6pt;
    }

    /* ── 헤더 ───────────────────────────────────────────────────── */
    .ms-header {
      font-family: "Nanum Pen Script", cursive;
      font-size: 7.5pt;
      color: #999;
      display: flex;
      gap: 6pt;
      margin-bottom: 3pt;
      align-items: center;
    }
    .ms-header .label { color: #bbb; }
    .ms-header .field {
      border-bottom: 0.3pt solid #ccc;
      min-width: 55pt;
      padding: 0 2pt;
      color: #777;
    }

    /* ── 원고지 그리드 — CSS Grid + border만 사용 ───────────────── */
    .manuscript-grid {
      display: grid;
      grid-template-columns: repeat(20, 1fr);
      grid-template-rows: repeat(35, 1fr);
      border: 1pt solid #999;
      width: 100%;
      min-height: 510pt;
    }
    .manuscript-grid .cell {
      border-right: 0.4pt solid #ccc;
      border-bottom: 0.4pt solid #ccc;
    }
    /* 20번째 열마다 오른쪽 테두리 제거 (마지막 열) */
    .manuscript-grid .cell:nth-child(20n) {
      border-right: none;
    }
    /* 681번째부터는 아래쪽 테두리 제거 (마지막 행: 20×34+1 = 681) */
    .manuscript-grid .cell:nth-child(n+681) {
      border-bottom: none;
    }

    /* ── 하단 ───────────────────────────────────────────────────── */
    .ms-footer {
      text-align: right;
      font-family: "Nanum Pen Script", cursive;
      font-size: 6pt;
      color: #ddd;
      margin-top: 1.5pt;
    }

    @media print {
      .hai-page { padding: 3pt 6pt 1pt 6pt; }
    }
  </style>
</head>
<body>

<section class="hai-page">

  <!-- 원고지 헤더 -->
  <div class="ms-header">
    <span class="label">제목</span><span class="field" style="min-width:140pt;">&nbsp;</span>
    <span class="label">소속 / 이름</span><span class="field" style="min-width:90pt;">&nbsp;</span>
    <span class="label">날짜</span><span class="field" style="min-width:60pt;">&nbsp;</span>
  </div>

  <!-- 원고지 그리드: 20열 × 35행 = 700칸 -->
  <div class="manuscript-grid" id="grid"></div>

  <p class="ms-footer">20×35 · 700자</p>

</section>

<script>
  const grid = document.getElementById('grid');
  for (let i = 0; i < 20 * 35; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    grid.appendChild(cell);
  }
</script>

</body>
</html>
