<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Writing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Edu+VIC+WA+NT+Hand:wght@400..700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/htmlasitis@0.1.0/htmlasitis.css">
  <style>
    :root {
      --hai-font-body: "Edu VIC WA NT Hand", cursive;
      --hai-font-mono: "Edu VIC WA NT Hand", monospace;
      --hai-font-size-body: 11pt;
      --hai-line-height-body: 1.7;
    }

    .hai-page {
      background: #ffffff;
      padding: 8pt 10pt 0 10pt;
    }

    .hai-page h1 {
      font-family: "Edu VIC WA NT Hand", cursive;
      font-size: 14pt;
      font-weight: 500;
      margin: 0 0 2pt 0;
      padding-bottom: 2pt;
      border-bottom: 0.5pt solid #ddd;
      color: #555;
      text-align: center;
      letter-spacing: 0.3pt;
    }

    .hairline { border: none; border-top: 0.25pt solid #e8e8e8; margin: 4pt 0; }

    .row { display: flex; gap: 6pt; }
    .c1 { flex: 1; } .c2 { flex: 2; } .c3 { flex: 3; }

    /* ── Tiny header ────────────────────────────────────────────── */
    .tiny-header {
      display: flex;
      align-items: center;
      gap: 4pt;
      font-family: "Edu VIC WA NT Hand", cursive;
      font-size: 9.5pt;
      font-weight: 400;
      color: #777;
      margin-bottom: 3pt;
      flex-wrap: wrap;
    }
    .tiny-header .label { color: #bbb; font-size: 8pt; margin-right: 1pt; }
    .tiny-header .value {
      border-bottom: 0.4pt solid #ddd;
      min-width: 55pt;
      padding: 0 3pt;
      font-size: 9.5pt;
    }

    /* ── Tiny hint line ─────────────────────────────────────────── */
    .hint-line {
      font-family: "Edu VIC WA NT Hand", cursive;
      font-size: 7.5pt;
      font-weight: 400;
      color: #ccc;
      margin-bottom: 4pt;
      line-height: 1.3;
      text-align: center;
    }

    .writing-block {
      padding: 0 2pt;
      font-family: "Edu VIC WA NT Hand", cursive;
      font-size: 11pt;
      font-weight: 400;
      line-height: 1.55;
      color: #444;
    }

    .ext-badge {
      display: inline-block;
      font-family: "Edu VIC WA NT Hand", cursive;
      font-size: 7.5pt;
      font-weight: 400;
      color: #ccc;
      border: 0.3pt solid #eee;
      padding: 1pt 6pt;
      border-radius: 2pt;
      margin-bottom: 3pt;
    }

    .footer-note {
      text-align: right;
      font-family: "Edu VIC WA NT Hand", cursive;
      font-size: 7.5pt;
      font-weight: 400;
      color: #ddd;
      margin-top: 4pt;
    }

    .pl {
      border-bottom: 0.3pt solid #e8e8e8;
      min-height: 17.5pt;
      margin: 0.5pt 0;
    }

    @media print {
      .hai-page + .hai-page {
        page-break-before: always;
      }
    }
  </style>
</head>
<body>

<!-- ================================================================ -->
<!-- Page 1: Free Writing — maximum lines                                -->
<!-- ================================================================ -->
<section class="hai-page">
  <h1>✽ Free Writing ✽</h1>

  <div class="writing-block" style="min-height:455pt;">
    <div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div>
    <div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div>
    <div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div>
    <div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div>
    <div class="pl"></div><div class="pl"></div><div class="pl"></div>
  </div>

  <div class="tiny-header" style="margin-top:4pt;">
    <span class="label">Date</span><span class="value" style="min-width:95pt;">&nbsp;</span>
    <span class="label">Topic</span><span class="value" style="min-width:145pt;">&nbsp;</span>
  </div>

  <p class="footer-note">if you kept the pen moving, you won</p>
</section>

<!-- ================================================================ -->
<!-- Page 2+: Extension                                                 -->
<!-- ================================================================ -->
<section class="hai-page">
  <span class="ext-badge">continued</span>
  <h1>✽ Free Writing ✽</h1>

  <div class="writing-block" style="min-height:475pt;">
    <div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div>
    <div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div>
    <div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div>
    <div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div>
    <div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div><div class="pl"></div>
  </div>

  <div class="tiny-header" style="margin-top:4pt;">
    <span class="label">Date</span><span class="value" style="min-width:95pt;">&nbsp;</span>
    <span class="label">Topic</span><span class="value" style="min-width:145pt;">&nbsp;</span>
  </div>

  <p class="footer-note">print as many copies as you need</p>
</section>

</body>
</html>
